<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arquivo WhatsApp — Entrar</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">W</div><h1>Arquivo WhatsApp</h1><p>{{ 'Digite sua senha para continuar.' if configured else 'Crie uma senha local para proteger suas conversas.' }}</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Senha<input name="password" type="password" minlength="10" autofocus required autocomplete="current-password"></label><button type="submit">{{ 'Entrar' if configured else 'Criar senha e entrar' }}</button></form><small>Seus dados permanecem neste computador.</small></main></body></html>
